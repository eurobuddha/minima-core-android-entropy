plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.eurobuddha.entropy'
    compileSdk 36

    defaultConfig {
        applicationId "com.eurobuddha.entropy"
        minSdk 28
        targetSdk 35
        versionCode 102
        versionName "0.1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sign release with the debug keystore, matching the minima-core-android node app.
            // IPC is authorized by the MINIMA_ID token, not by signature, so this is
            // sufficient for sideloading. Swap to a dedicated release keystore for Play.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation files('libs/minimaapi.aar')
    testImplementation 'junit:junit:4.13.2'
}
